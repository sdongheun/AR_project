name: ARBusan
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: "$(inherited) -ObjC"
packages: {}
targets:
  ARBusan:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ARBusan
    resources:
      - path: ARBusan/Resources
    info:
      path: ARBusan/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        NSCameraUsageDescription: "건물 간판과 외관을 AR로 인식하기 위해 카메라 접근이 필요합니다."
        NSLocationWhenInUseUsageDescription: "현재 위치 주변의 건물 후보를 찾고 VPS 인식을 수행하기 위해 위치 접근이 필요합니다."
        NSLocationTemporaryUsageDescriptionDictionary:
          ARBusanPreciseLocation: "정확한 건물 후보 판정과 VPS 인식을 위해 정밀 위치가 필요합니다."
        ARBUSAN_TOUR_API_KEY: "$(TOUR_API_KEY)"
        ARBUSAN_VWORLD_API_KEY: "$(VWORLD_API_KEY)"
        ARBUSAN_GOOGLE_ARCORE_API_KEY: "$(GOOGLE_ARCORE_API_KEY)"
        GARAPIKey: "$(GOOGLE_ARCORE_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ARBusan
        PRODUCT_NAME: ARBusan
        INFOPLIST_FILE: ARBusan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 642X5R37S7
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Vision.framework
      - sdk: CoreLocation.framework
      - sdk: SwiftData.framework
  ARBusanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ARBusanTests
    dependencies:
      - target: ARBusan
schemes:
  ARBusan:
    build:
      targets:
        ARBusan: all
        ARBusanTests: [test]
    test:
      targets:
        - ARBusanTests
